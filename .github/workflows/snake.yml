
Snake · YML
name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"   # otomatis tiap hari jam 00:00 UTC
  workflow_dispatch:       # bisa run manual
 
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # <-- INI yang fix exit code 128
 
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: BIIYYU
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
 
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4   # <-- update v3 → v4 (fix Node.js warning)
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
